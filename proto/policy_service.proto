// PolicyService: LinUCB routing brain (Section 2–3). Internal gRPC only.
// Computes a joint action from pre-execution StateVector; MUST complete within the
// gateway pre-execution budget (architecture target <10ms end-to-end before execution).

syntax = "proto3";

package forgeai.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/forgeai/forgeai/gen/go/forgeai/v1;forgeaiv1";

// PolicyService selects routing actions for each request.
service PolicyService {
  // Decide selects chosen_action and exploration metadata for one request.
  // Deadline / timeout: caller SHOULD use <=15ms; exceeds architecture pre-execution budget if longer.
  rpc Decide(PolicyDecideRequest) returns (PolicyDecideResponse);
  // RecordReward applies an online reward update to the authoritative in-process bandit.
  // Caller is gateway hot path; timeout SHOULD be <=5ms.
  rpc RecordReward(RecordRewardRequest) returns (RecordRewardResponse);
  // LoadPolicy hot-swaps policy state with a serialized artifact.
  rpc LoadPolicy(LoadPolicyRequest) returns (LoadPolicyResponse);
}

// PolicyDecideRequest: single decision call; not reused by other RPCs.
message PolicyDecideRequest {
  // Field 1 is frozen; never reuse. Correlates to routing_decisions.request_id (UUID string).
  string correlation_request_id = 1;
  // Field 2 is frozen; never reuse. Tenant UUID string for policy isolation and logging.
  string tenant_id = 2;
  // Field 3 is frozen; never reuse. Pre-execution routing features only (Section 3).
  StateVector routing_state_features = 3;
  // Field 4 is frozen; never reuse. Execution engine deployment id/version string at decision time.
  string execution_deployment_version = 4;
  // Field 5 is frozen; never reuse. Wall time when gateway received the HTTP request (audit).
  google.protobuf.Timestamp gateway_ingress_timestamp_utc = 5;
}

// PolicyDecideResponse: bandit output for logging and downstream execution (not reused by other RPCs).
message PolicyDecideResponse {
  // Field 1 is frozen; never reuse. Action taken (after exploration), all four dimensions set.
  ActionSpec chosen_action = 1;
  // Field 2 is frozen; never reuse. True if exploration deviated from greedy policy.
  bool exploration_flag = 2;
  // Field 3 is frozen; never reuse. EXPLORATION_TYPE_NONE when exploration_flag is false; otherwise EPSILON, UCB, or FORCED.
  // EXPLORATION_TYPE_UNSPECIFIED indicates a contract violation on the producer side and MUST NOT be used for "not exploring".
  ExplorationType exploration_type = 3;
  // Field 4 is frozen; never reuse. Greedy policy action without exploration (for counterfactual logging).
  ActionSpec greedy_action = 4;
  // Field 5 is frozen; never reuse. Score for each of 81 flat actions; keys MUST be canonical_action_key
  // format: "<model_tier>_<precision>_<retrieval_mode>_<output_budget>" using lower_snake enum value
  // tokens without enum prefix, e.g. "medium_fp16_cache_only_medium". Values are LinUCB scores (not money).
  map<string, float> action_scores = 5;
  // Field 6 is frozen; never reuse. Bandit artifact / policy version string persisted to routing_decisions.
  string policy_version = 6;
}

// RecordRewardRequest: synchronous post-execution feedback for online bandit update.
message RecordRewardRequest {
  // Field 1 is frozen; never reuse. Correlates to routing_decisions.request_id (UUID string).
  string request_id = 1;
  // Field 2 is frozen; never reuse. The executed action to update.
  ActionSpec action = 2;
  // Field 3 is frozen; never reuse. Online reward scalar computed synchronously in gateway.
  float r_online = 3;
  // Field 4 is frozen; never reuse. Pre-execution feature vector used for this decision.
  StateVector feature_vector = 4;
}

// RecordRewardResponse: acknowledgment from policy service update path.
message RecordRewardResponse {
  // Field 1 is frozen; never reuse. True when bandit update was applied.
  bool acknowledged = 1;
  // Field 2 is frozen; never reuse. Policy version after update attempt.
  string policy_version = 2;
}

// LoadPolicyRequest carries serialized LinUCB policy state bytes.
message LoadPolicyRequest {
  bytes serialized_policy_bytes = 1;
}

// LoadPolicyResponse indicates whether hot-swap succeeded.
message LoadPolicyResponse {
  bool acknowledged = 1;
  string new_policy_version = 2;
}
