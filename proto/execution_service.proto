// ExecutionService: vLLM-backed generation (Section 2). Internal gRPC only; streams tokens
// to the gateway. Loads quantized weights per ActionSpec; invokes retrieval when retrieval_mode != OFF.

syntax = "proto3";

package forgeai.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/forgeai/forgeai/gen/go/forgeai/v1;forgeaiv1";

// ExecutionService runs the model forward pass with server-side streaming of generated text.
service ExecutionService {
  // Execute streams generated token text fragments until completion or error.
  // Deadline / timeout: long-lived stream; client SHOULD set deadline to full user-visible latency SLO.
  // First-token latency MUST stay within execution SLO derived from routing latency_slo_ms.
  rpc Execute(ExecutionExecuteRequest) returns (stream ExecutionExecuteServerStreamChunk);
}

// ExecutionExecuteRequest: one generation job; not reused by other RPCs.
message ExecutionExecuteRequest {
  // Field 1 is frozen; never reuse. Correlates with routing_decisions.request_id.
  string correlation_request_id = 1;
  // Field 2 is frozen; never reuse. Tenant UUID string.
  string tenant_id = 2;
  // Field 3 is frozen; never reuse. Policy-selected joint action (all dimensions required).
  ActionSpec routing_action_spec = 3;
  // Field 4 is frozen; never reuse. User prompt text (UTF-8). Not logged verbatim in proto on wire beyond TLS.
  string user_prompt_utf8 = 4;
  // Field 5 is frozen; never reuse. Hard cap on generated tokens for this call (enforces output_budget at token layer).
  int32 max_output_token_limit = 5;
  // Field 6 is frozen; never reuse. When set, execution MUST use this registry model_version_id UUID string.
  optional string pinned_model_version_id = 6;
  // Field 7 is frozen; never reuse. Start time of execution attempt (observability).
  google.protobuf.Timestamp execution_start_timestamp_utc = 7;
  // Field 8 is frozen; never reuse. Client session UUID string for in-process ElephantBroker
  // memory context; when unset, execution uses correlation_request_id as the session key.
  optional string broker_session_id_utf8 = 8;
}

// ExecutionExecuteServerStreamChunk: one server→client streaming payload; not reused by other RPCs.
message ExecutionExecuteServerStreamChunk {
  // Field 1 is frozen; never reuse. UTF-8 text fragment (may be a token, subword, or decoder chunk).
  string generated_text_delta_utf8 = 1;
  // Field 2 is frozen; never reuse. True on the terminal chunk for this stream.
  bool stream_finished = 2;
  // Field 3 is frozen; never reuse. Monotonic partial output token count estimate (best-effort).
  int32 cumulative_output_tokens_estimate = 3;
  // Field 4 is frozen; never reuse. Populated only when stream_finished=true; total billed USD in microdollars (no float money).
  optional MoneyMicrodollars stream_final_cost_microdollars = 4;
  // Field 5 is frozen; never reuse. Populated only when stream_finished=true; wall end of generation.
  google.protobuf.Timestamp execution_end_timestamp_utc = 5;
  // Field 6 is frozen; never reuse. Terminal error text; leave unset on success-only streams.
  optional string stream_error_message_utf8 = 6;
  // Field 7 is frozen; never reuse. Hint to gateway to mark routing_decisions.fallback_used downstream.
  optional bool gateway_fallback_used_hint = 7;
}
