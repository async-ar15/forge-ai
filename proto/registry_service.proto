// RegistryService: Postgres + S3 metadata plane (Section 2). Internal gRPC only.
// CRUD for model_versions, quant_profiles, deployments, eval_runs as defined in Section 4.

syntax = "proto3";

package forgeai.v1;

import "common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/forgeai/forgeai/gen/go/forgeai/v1;forgeaiv1";

// RegistryService persists and queries model registry entities.
service RegistryService {
  // --- model_versions (Section 4) ---
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryCreateModelVersion(RegistryCreateModelVersionRequest)
      returns (RegistryCreateModelVersionResponse);
  // Deadline / timeout: caller SHOULD use <=50ms.
  rpc RegistryGetModelVersion(RegistryGetModelVersionRequest)
      returns (RegistryGetModelVersionResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryUpdateModelVersion(RegistryUpdateModelVersionRequest)
      returns (RegistryUpdateModelVersionResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryDeleteModelVersion(RegistryDeleteModelVersionRequest)
      returns (RegistryDeleteModelVersionResponse);
  // Deadline / timeout: caller SHOULD use <=200ms.
  rpc RegistryListModelVersions(RegistryListModelVersionsRequest)
      returns (RegistryListModelVersionsResponse);

  // --- quant_profiles (Section 4) ---
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryCreateQuantProfile(RegistryCreateQuantProfileRequest)
      returns (RegistryCreateQuantProfileResponse);
  // Deadline / timeout: caller SHOULD use <=50ms.
  rpc RegistryGetQuantProfile(RegistryGetQuantProfileRequest)
      returns (RegistryGetQuantProfileResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryUpdateQuantProfile(RegistryUpdateQuantProfileRequest)
      returns (RegistryUpdateQuantProfileResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryDeleteQuantProfile(RegistryDeleteQuantProfileRequest)
      returns (RegistryDeleteQuantProfileResponse);
  // Deadline / timeout: caller SHOULD use <=200ms.
  rpc RegistryListQuantProfiles(RegistryListQuantProfilesRequest)
      returns (RegistryListQuantProfilesResponse);

  // --- deployments (Section 4) ---
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryCreateDeployment(RegistryCreateDeploymentRequest)
      returns (RegistryCreateDeploymentResponse);
  // Deadline / timeout: caller SHOULD use <=50ms.
  rpc RegistryGetDeployment(RegistryGetDeploymentRequest)
      returns (RegistryGetDeploymentResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryUpdateDeployment(RegistryUpdateDeploymentRequest)
      returns (RegistryUpdateDeploymentResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryDeleteDeployment(RegistryDeleteDeploymentRequest)
      returns (RegistryDeleteDeploymentResponse);
  // Deadline / timeout: caller SHOULD use <=200ms.
  rpc RegistryListDeployments(RegistryListDeploymentsRequest)
      returns (RegistryListDeploymentsResponse);
  // Deadline / timeout: caller SHOULD use <=200ms. Resolves active serving row for execution (Section 2/5).
  rpc RegistryResolveExecutionModel(RegistryResolveExecutionModelRequest)
      returns (RegistryResolveExecutionModelResponse);

  // --- eval_runs (Section 4) ---
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryCreateEvalRun(RegistryCreateEvalRunRequest) returns (RegistryCreateEvalRunResponse);
  // Deadline / timeout: caller SHOULD use <=50ms.
  rpc RegistryGetEvalRun(RegistryGetEvalRunRequest) returns (RegistryGetEvalRunResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryUpdateEvalRun(RegistryUpdateEvalRunRequest) returns (RegistryUpdateEvalRunResponse);
  // Deadline / timeout: caller SHOULD use <=500ms.
  rpc RegistryDeleteEvalRun(RegistryDeleteEvalRunRequest) returns (RegistryDeleteEvalRunResponse);
  // Deadline / timeout: caller SHOULD use <=200ms.
  rpc RegistryListEvalRuns(RegistryListEvalRunsRequest) returns (RegistryListEvalRunsResponse);
}

// ========================= model_versions =====================================

message RegistryCreateModelVersionRequest {
  // Field 1 is frozen; never reuse. Parent models.model_id UUID string.
  string owning_model_id = 1;
  // Field 2 is frozen; never reuse. Semantic version tag string (e.g. v1.3.0).
  string semantic_version_tag = 2;
  // Field 3 is frozen; never reuse. artifacts.artifact_id UUID string (S3 pointer).
  string artifact_object_id = 3;
  // Field 4 is frozen; never reuse. Optional quant_profiles.profile_id UUID string.
  optional string linked_quant_profile_id = 4;
  // Field 5 is frozen; never reuse. Optional training_runs.training_run_id UUID string.
  optional string originating_training_run_id = 5;
}

message RegistryCreateModelVersionResponse {
  // Field 1 is frozen; never reuse. Assigned model_versions.version_id UUID string.
  string created_model_version_id = 1;
  // Field 2 is frozen; never reuse. Row creation time (UTC).
  google.protobuf.Timestamp registry_row_created_timestamp_utc = 2;
}

message RegistryGetModelVersionRequest {
  // Field 1 is frozen; never reuse. model_versions.version_id UUID string.
  string model_version_id = 1;
}

message RegistryGetModelVersionResponse {
  // Field 1 is frozen; never reuse.
  string model_version_id = 1;
  // Field 2 is frozen; never reuse.
  string owning_model_id = 2;
  // Field 3 is frozen; never reuse.
  string semantic_version_tag = 3;
  // Field 4 is frozen; never reuse.
  string artifact_object_id = 4;
  // Field 5 is frozen; never reuse.
  optional string linked_quant_profile_id = 5;
  // Field 6 is frozen; never reuse.
  optional string originating_training_run_id = 6;
  // Field 7 is frozen; never reuse.
  google.protobuf.Timestamp registry_row_created_timestamp_utc = 7;
  // Field 8 is frozen; never reuse.
  google.protobuf.Timestamp registry_row_updated_timestamp_utc = 8;
  // Field 9 is frozen; never reuse.
  optional google.protobuf.Timestamp promoted_to_serving_timestamp_utc = 9;
}

message RegistryUpdateModelVersionRequest {
  // Field 1 is frozen; never reuse. Target model_versions.version_id UUID string.
  string model_version_id = 1;
  // Field 2 is frozen; never reuse.
  optional string semantic_version_tag = 2;
  // Field 3 is frozen; never reuse.
  optional string artifact_object_id = 3;
  // Field 4 is frozen; never reuse.
  optional string linked_quant_profile_id = 4;
  // Field 5 is frozen; never reuse.
  optional string originating_training_run_id = 5;
  // Field 6 is frozen; never reuse.
  optional google.protobuf.Timestamp promoted_to_serving_timestamp_utc = 6;
}

message RegistryUpdateModelVersionResponse {
  // Field 1 is frozen; never reuse. Rows affected (0 or 1).
  int32 rows_affected = 1;
  // Field 2 is frozen; never reuse.
  google.protobuf.Timestamp registry_row_updated_timestamp_utc = 2;
}

message RegistryDeleteModelVersionRequest {
  // Field 1 is frozen; never reuse. model_versions.version_id UUID string.
  string model_version_id = 1;
}

message RegistryDeleteModelVersionResponse {
  // Field 1 is frozen; never reuse. Rows deleted (0 or 1).
  int32 rows_deleted = 1;
}

message RegistryListModelVersionsRequest {
  // Field 1 is frozen; never reuse. Parent models.model_id UUID string.
  string owning_model_id = 1;
  // Field 2 is frozen; never reuse. Page size cap.
  int32 page_size = 2;
  // Field 3 is frozen; never reuse. Opaque pagination cursor (empty for first page).
  string page_cursor = 3;
}

message RegistryListModelVersionsResponse {
  // Field 1 is frozen; never reuse. Rows for this page only (type used only here).
  repeated RegistryListModelVersionsResponseRow rows = 1;
  // Field 2 is frozen; never reuse. Next cursor or empty if terminal.
  string next_page_cursor = 2;
}

// RegistryListModelVersionsResponseRow: list row shape; referenced only by RegistryListModelVersionsResponse.
message RegistryListModelVersionsResponseRow {
  // Field 1 is frozen; never reuse.
  string model_version_id = 1;
  // Field 2 is frozen; never reuse.
  string semantic_version_tag = 2;
  // Field 3 is frozen; never reuse.
  string artifact_object_id = 3;
  // Field 4 is frozen; never reuse.
  optional string linked_quant_profile_id = 4;
  // Field 5 is frozen; never reuse.
  google.protobuf.Timestamp registry_row_created_timestamp_utc = 5;
}

// ========================= quant_profiles =====================================

message RegistryCreateQuantProfileRequest {
  // Field 1 is frozen; never reuse. model_versions.version_id UUID string.
  string parent_model_version_id = 1;
  // Field 2 is frozen; never reuse.
  QuantizationMethod quantization_method = 2;
  // Field 3 is frozen; never reuse. Global precision tier for the profile.
  Precision global_precision = 3;
  // Field 4 is frozen; never reuse. Per-layer overrides JSON (maps to quant_profiles.layer_config).
  google.protobuf.Struct layer_precision_config_json = 4;
  // Field 5 is frozen; never reuse. Accuracy delta vs fp16 baseline (not monetary).
  double accuracy_delta_vs_fp16_baseline = 5;
  // Field 6 is frozen; never reuse. Speedup multiplier vs fp16 (not monetary).
  double latency_speedup_multiplier_vs_fp16 = 6;
  // Field 7 is frozen; never reuse. Resident set size estimate megabytes.
  int32 model_memory_footprint_mb = 7;
  // Field 8 is frozen; never reuse. eval_runs.eval_run_id UUID string that validated the profile.
  string validating_eval_run_id = 8;
