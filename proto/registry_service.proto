// RegistryResolveExecutionModelRequest: execution hot-path lookup by capacity + precision (Section 2).
message RegistryResolveExecutionModelRequest {
  // Field 1 is frozen; never reuse.
  ModelTier model_tier = 1;
  // Field 2 is frozen; never reuse.
  Precision execution_precision = 2;
  // Field 3 is frozen; never reuse.
  ServingEnvironment serving_environment = 3;
}

// RegistryResolveExecutionModelResponse: materialized artifact pointer for vLLM load.
message RegistryResolveExecutionModelResponse {
  // Field 1 is frozen; never reuse. False when execution_precision is not served for the tier.
  bool resolution_ok = 1;
  // Field 2 is frozen; never reuse. model_versions.version_id UUID string when resolution_ok.
  string model_version_id = 2;
  // Field 3 is frozen; never reuse. artifacts / cache-relative object key or storage id.
  string artifact_object_id = 3;
  // Field 4 is frozen; never reuse. quant_profiles.profile_id when quantized weights are linked.
  optional string linked_quant_profile_id = 4;
  // Field 5 is frozen; never reuse. Registry-native precisions available when resolution_ok is false.
  repeated Precision available_precisions_for_tier = 5;
}

// ============================= eval_runs ======================================

message RegistryCreateEvalRunRequest {
  // Field 1 is frozen; never reuse. model_versions.version_id UUID string evaluated.
  string evaluated_model_version_id = 1;
  // Field 2 is frozen; never reuse.
  EvalRunCategory eval_run_category = 2;
  // Field 3 is frozen; never reuse. Judge or metric source identifier string.
  string judge_model_identifier = 3;
  // Field 4 is frozen; never reuse. datasets.dataset_id UUID string.
  string evaluation_dataset_id = 4;
  // Field 5 is frozen; never reuse. Aggregate scalar score (not USD; use microdollars only for money fields).
  double aggregate_eval_score = 5;
  // Field 6 is frozen; never reuse. Per-rubric JSON (maps to eval_runs.score_breakdown).
  google.protobuf.Struct eval_score_breakdown_json = 6;
  // Field 7 is frozen; never reuse. Optional total eval dollar cost in microdollars when eval_run_category=COST.
  optional MoneyMicrodollars total_eval_cost_microdollars = 7;
}

