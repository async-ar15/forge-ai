apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeai-config
  namespace: forgeai
  labels:
    app: forgeai
    component: platform
    version: v1
data:
  POLICY_ENGINE_GRPC_HOST: "forgeai-policy"
  POLICY_ENGINE_GRPC_PORT: "50051"
  EXECUTION_ENGINE_GRPC_HOST: "forgeai-execution"
  EXECUTION_ENGINE_GRPC_PORT: "50052"
  RETRIEVAL_ENGINE_GRPC_HOST: "forgeai-retrieval"
  RETRIEVAL_ENGINE_GRPC_PORT: "50053"
  MODEL_REGISTRY_GRPC_HOST: "forgeai-registry"
  MODEL_REGISTRY_GRPC_PORT: "50054"
  KAFKA_CLIENT_ID: "forgeai"
  KAFKA_CONSUMER_GROUP_ID: "forgeai-v1"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  QDRANT_COLLECTION_NAME: "forgeai-v1"
  CACHE_TTL_SECONDS: "3600"
  RETRIEVAL_BLOOM_FILTER_KEY: "forgeai:bloom:retrieval"
  GATEWAY_LOG_LEVEL: "INFO"
  PROMETHEUS_METRICS_PORT: "9099"
  GATEWAY_EXECUTION_DEPLOYMENT_VERSION: "v1"
  GATEWAY_SHUTDOWN_DRAIN_SECONDS: "30"
  GATEWAY_HEALTH_LOADED_MODELS_CSV: "small,medium,large"
  POLICY_SERVICE_PORT: "50051"
