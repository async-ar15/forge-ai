apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-training
  namespace: forgeai
  labels:
    app: forgeai
    component: training
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeai
      component: training
  template:
    metadata:
      labels:
        app: forgeai
        component: training
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgeai
                    component: training
      containers:
        - name: training
          image: forgeai/training:v1
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-training
  namespace: forgeai
  labels:
    app: forgeai
    component: training
    version: v1
spec:
  type: ClusterIP
  selector:
    app: forgeai
    component: training
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeai-training
  namespace: forgeai
  labels:
    app: forgeai
    component: training
    version: v1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeai-training
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
