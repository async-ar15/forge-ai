apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeai-gateway
  namespace: forgeai
  labels:
    app: forgeai
    component: gateway
    version: v1
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  tls:
    - hosts:
        - api.forgeai.local
      secretName: forgeai-tls
  rules:
    - host: api.forgeai.local
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                name: forgeai-gateway
                port:
                  number: 80
