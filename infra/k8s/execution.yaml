apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-execution
  namespace: forgeai
  labels:
    app: forgeai
    component: execution
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeai
      component: execution
  template:
    metadata:
      labels:
        app: forgeai
        component: execution
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgeai
                    component: execution
      containers:
        - name: execution
          image: forgeai/execution:v1
          ports:
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-execution
  namespace: forgeai
  labels:
    app: forgeai
    component: execution
    version: v1
spec:
  type: ClusterIP
  selector:
    app: forgeai
    component: execution
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeai-execution
  namespace: forgeai
  labels:
    app: forgeai
    component: execution
    version: v1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeai-execution
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: forgeai_execution_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
