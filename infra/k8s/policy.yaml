apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-policy
  namespace: forgeai
  labels:
    app: forgeai
    component: policy
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeai
      component: policy
  template:
    metadata:
      labels:
        app: forgeai
        component: policy
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgeai
                    component: policy
      containers:
        - name: policy
          image: forgeai/policy:v1
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-policy
  namespace: forgeai
  labels:
    app: forgeai
    component: policy
    version: v1
spec:
  type: ClusterIP
  selector:
    app: forgeai
    component: policy
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeai-policy
  namespace: forgeai
  labels:
    app: forgeai
    component: policy
    version: v1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeai-policy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
