apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-retrieval
  namespace: forgeai
  labels:
    app: forgeai
    component: retrieval
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeai
      component: retrieval
  template:
    metadata:
      labels:
        app: forgeai
        component: retrieval
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgeai
                    component: retrieval
      containers:
        - name: retrieval
          image: forgeai/retrieval:v1
          ports:
            - containerPort: 50053
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-retrieval
  namespace: forgeai
  labels:
    app: forgeai
    component: retrieval
    version: v1
spec:
  type: ClusterIP
  selector:
    app: forgeai
    component: retrieval
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeai-retrieval
  namespace: forgeai
  labels:
    app: forgeai
    component: retrieval
    version: v1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeai-retrieval
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
