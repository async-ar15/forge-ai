apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-gateway
  namespace: forgeai
  labels:
    app: forgeai
    component: gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeai
      component: gateway
  template:
    metadata:
      labels:
        app: forgeai
        component: gateway
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: forgeai
                    component: gateway
      containers:
        - name: gateway
          image: forgeai/gateway:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-gateway
  namespace: forgeai
  labels:
    app: forgeai
    component: gateway
    version: v1
spec:
  type: LoadBalancer
  selector:
    app: forgeai
    component: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeai-gateway
  namespace: forgeai
  labels:
    app: forgeai
    component: gateway
    version: v1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeai-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
