[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI deterministic AI customization and inference platform (scaffold)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.7",
    "aiokafka>=0.10",
    "boto3>=1.34",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
    "pandas>=2.2",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "openai>=1.40",
    "opentelemetry-api>=1.23",
    "nvidia-ml-py>=12.560.30",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "psycopg2-binary>=2.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.8",
    "mypy-protobuf>=3.6",
    "ruff>=0.3",
    "black>=24.2",
    "types-redis",
    "types-protobuf",
    "grpc-stubs>=1.53",
    "boto3-stubs[s3]>=1.34",
]

[project.scripts]
forgeai-retrieval-grpc = "forgeai.retrieval.grpc_service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forgeai*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = "/migrations/versions/"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["forgeai", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"forgeai/retrieval/embedding_service.py" = ["I001"]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true # Third-party libs in this repo do not consistently ship stubs.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_subclassing_any = false # Third-party packages without stubs expose Any bases.
no_implicit_optional = true
show_error_codes = true
pretty = true
packages = ["forgeai"]
mypy_path = ["proto/generated", "typings"]
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    # Generated protobuf stubs are source-of-truth artifacts and may contain
    # typing patterns incompatible with strict mypy in some plugin versions.
    "common_pb2",
    "eval_service_pb2",
    "execution_service_pb2",
    "policy_service_pb2",
    "registry_service_pb2",
    "retrieval_service_pb2",
    "common_pb2_grpc",
    "eval_service_pb2_grpc",
    "execution_service_pb2_grpc",
    "policy_service_pb2_grpc",
    "registry_service_pb2_grpc",
    "retrieval_service_pb2_grpc",
]
ignore_errors = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
